# Shared recipe. No workspace field means no Mac project directory is mounted.
# This path matches chezmoi's standard source directory on every Mac.
schemaVersion: "1"
agent: "${{ env.args.agent }}"
args:
  agent:
    default: claude
    enum: [claude, codex, opencode]
  repo:
    required: true
    description: GitHub OWNER/REPO
  browser:
    default: "false"
    enum: ["false", "true"]
  ref:
    default: main
    description: Dotfiles branch or tag used for guest setup
  task:
    required: true
    pattern: '^[a-z][a-z0-9-]{0,31}-[0-9a-f]{8}$'
  branch:
    default: new
    pattern: '^(new|agent/[a-z][a-z0-9-]{0,31}-[0-9a-f]{8})$'
kits:
  - source: ./.local/share/chezmoi/sandbox
    args:
      agent: "${{ env.args.agent }}"
      repo: "${{ env.args.repo }}"
      browser: "${{ env.args.browser }}"
      ref: "${{ env.args.ref }}"
      task: "${{ env.args.task }}"
      branch: "${{ env.args.branch }}"
sandboxOptions:
  cpus: 4
  memory: 4g
  skills: readonly
